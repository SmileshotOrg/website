<svg width="480" height="340" viewBox="0 0 480 340" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="cardBg2Cam" x1="0" y1="0" x2="480" y2="340" gradientUnits="userSpaceOnUse">
      <stop stop-color="#151828" stop-opacity="0.9"/>
      <stop stop-color="#0b0e1b" stop-opacity="0.95"/>
    </linearGradient>
    <linearGradient id="accentGlow2Cam" x1="40" y1="40" x2="440" y2="300" gradientUnits="userSpaceOnUse">
      <stop stop-color="#3B82F6" stop-opacity="0.25"/>
      <stop stop-color="#6663F6" stop-opacity="0.08"/>
    </linearGradient>
  </defs>

  <!-- Background Panel -->
  <rect x="20" y="20" width="440" height="300" rx="20" fill="url(#cardBg2Cam)" stroke="#ffffff" stroke-opacity="0.1" stroke-width="1.5"/>
  <rect x="20" y="20" width="440" height="300" rx="20" fill="url(#accentGlow2Cam)"/>

  <!-- Top Header Bar -->
  <rect x="40" y="44" width="14" height="14" rx="7" fill="#6663F6" fill-opacity="0.4"/>
  <rect x="62" y="44" width="14" height="14" rx="7" fill="#3B82F6" fill-opacity="0.4"/>
  <rect x="84" y="44" width="14" height="14" rx="7" fill="#10B981" fill-opacity="0.4"/>
  
  <text x="240" y="56" fill="#8A8F98" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" text-anchor="middle" letter-spacing="0.5">CHAIRSIDE CAPTURE • ANY CAMERA OR DEVICE</text>

  <!-- Left Side: Camera & Ring Flash Graphic -->
  <g transform="translate(44, 82)">
    <rect width="210" height="216" rx="14" fill="#0A0D18" stroke="#ffffff" stroke-opacity="0.08"/>
    
    <!-- Professional DSLR / Lens Outline -->
    <rect x="35" y="32" width="140" height="96" rx="12" fill="#151A2E" stroke="#3B82F6" stroke-opacity="0.5" stroke-width="1.5"/>
    <!-- Top prism & dial -->
    <path d="M75 32 L88 18 L122 18 L135 32 Z" fill="#1D243F" stroke="#3B82F6" stroke-opacity="0.5" stroke-width="1.5"/>
    <rect x="48" y="24" width="16" height="8" rx="2" fill="#6663F6" fill-opacity="0.6"/>
    
    <!-- Camera Lens & Ring Flash -->
    <circle cx="105" cy="80" r="36" fill="#0D101D" stroke="#60A5FA" stroke-width="2"/>
    <circle cx="105" cy="80" r="26" fill="#182038" stroke="#8C88FF" stroke-width="1.5" stroke-dasharray="4 2"/>
    <circle cx="105" cy="80" r="14" fill="#090C16"/>
    <circle cx="111" cy="74" r="4" fill="#60A5FA" fill-opacity="0.8"/>

    <!-- Capture Specs -->
    <text x="105" y="152" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" text-anchor="middle">DSLR / Mirrorless / Phone</text>
    <text x="105" y="170" fill="#8A8F98" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9.5" text-anchor="middle">Timestamp Embedded (EXIF)</text>
    <text x="105" y="192" fill="#10B981" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="600" text-anchor="middle">● High-Res RAW / JPG</text>
  </g>

  <!-- Right Side: Capture Highlights & Supported Devices -->
  <g transform="translate(266, 82)">
    <rect width="170" height="216" rx="14" fill="#0A0D18" stroke="#ffffff" stroke-opacity="0.08"/>

    <!-- SD Card / Ingest Slot Graphic -->
    <g transform="translate(18, 16)">
      <rect width="134" height="54" rx="8" fill="#161B2E" stroke="#6663F6" stroke-opacity="0.3"/>
      <!-- SD Card Mini -->
      <path d="M16 14h24l8 8v20a2 2 0 01-2 2H16a2 2 0 01-2-2V16a2 2 0 012-2z" fill="#1E2744" stroke="#8C88FF" stroke-width="1.2"/>
      <rect x="20" y="18" width="3" height="6" rx="0.5" fill="#FBBF24"/>
      <rect x="25" y="18" width="3" height="6" rx="0.5" fill="#FBBF24"/>
      <rect x="30" y="18" width="3" height="6" rx="0.5" fill="#FBBF24"/>
      <text x="56" y="28" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="600">SD Card / Tether</text>
      <text x="56" y="42" fill="#9CA3AF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="8.5">Direct Camera Sync</text>
    </g>

    <!-- Compatibility Pills -->
    <g transform="translate(18, 80)">
      <rect width="134" height="34" rx="6" fill="#131726" stroke="#ffffff" stroke-opacity="0.05"/>
      <text x="14" y="21" fill="#60A5FA" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9.5" font-weight="600">📸 Canon, Nikon, Sony</text>
    </g>

    <g transform="translate(18, 122)">
      <rect width="134" height="34" rx="6" fill="#131726" stroke="#ffffff" stroke-opacity="0.05"/>
      <text x="14" y="21" fill="#60A5FA" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9.5" font-weight="600">🦷 Intraoral Cameras</text>
    </g>

    <g transform="translate(18, 164)">
      <rect width="134" height="36" rx="6" fill="#10B981" fill-opacity="0.1" stroke="#10B981" stroke-opacity="0.3"/>
      <text x="67" y="19" fill="#10B981" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" font-weight="700" text-anchor="middle">Zero Cloud Waiting</text>
      <text x="67" y="30" fill="#9CA3AF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="8" text-anchor="middle">Instant Local Transfer</text>
    </g>
  </g>
</svg>
