<svg width="480" height="340" viewBox="0 0 480 340" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="cardBg1" x1="0" y1="0" x2="480" y2="340" gradientUnits="userSpaceOnUse">
      <stop stop-color="#151828" stop-opacity="0.9"/>
      <stop stop-color="#0b0e1b" stop-opacity="0.95"/>
    </linearGradient>
    <linearGradient id="accentGlow1" x1="40" y1="40" x2="440" y2="300" gradientUnits="userSpaceOnUse">
      <stop stop-color="#6663F6" stop-opacity="0.3"/>
      <stop stop-color="#3B82F6" stop-opacity="0.05"/>
    </linearGradient>
    <filter id="shadow1" x="-20" y="-20" width="520" height="380" filterUnits="userSpaceOnUse">
      <feGaussianBlur in="SourceAlpha" stdDeviation="15"/>
      <feOffset dx="0" dy="10"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.4"/></feComponentTransfer>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background Panel -->
  <rect x="20" y="20" width="440" height="300" rx="20" fill="url(#cardBg1)" stroke="#ffffff" stroke-opacity="0.1" stroke-width="1.5"/>
  <rect x="20" y="20" width="440" height="300" rx="20" fill="url(#accentGlow1)"/>

  <!-- Top Header Bar -->
  <rect x="40" y="44" width="14" height="14" rx="7" fill="#6663F6" fill-opacity="0.4"/>
  <rect x="62" y="44" width="14" height="14" rx="7" fill="#3B82F6" fill-opacity="0.4"/>
  <rect x="84" y="44" width="14" height="14" rx="7" fill="#10B981" fill-opacity="0.4"/>
  
  <text x="240" y="56" fill="#8A8F98" font-family="-apple-system, sans-serif" font-size="12" font-weight="600" text-anchor="middle" letter-spacing="0.5">CLINIC DAYLIST INGESTION • EPHEMERAL RAM</text>
  
  <!-- Daylist Schedule Container -->
  <rect x="40" y="78" width="250" height="220" rx="14" fill="#0A0D18" stroke="#ffffff" stroke-opacity="0.08"/>
  
  <!-- Daylist Items -->
  <!-- Item 1 -->
  <g transform="translate(54, 94)">
    <rect width="222" height="42" rx="8" fill="#1E2235" stroke="#6663F6" stroke-opacity="0.4"/>
    <circle cx="16" cy="21" r="5" fill="#10B981"/>
    <text x="30" y="18" fill="#FFFFFF" font-family="-apple-system, sans-serif" font-size="12" font-weight="600">09:00 - Sarah Jenkins</text>
    <text x="30" y="32" fill="#8A8F98" font-family="-apple-system, sans-serif" font-size="10">Upper Anterior Veneers • 6 Photos</text>
    <rect x="175" y="12" width="38" height="18" rx="4" fill="#6663F6" fill-opacity="0.2"/>
    <text x="194" y="24" fill="#8C88FF" font-family="-apple-system, sans-serif" font-size="9" font-weight="600" text-anchor="middle">SYNCED</text>
  </g>

  <!-- Item 2 -->
  <g transform="translate(54, 144)">
    <rect width="222" height="42" rx="8" fill="#151928" stroke="#ffffff" stroke-opacity="0.06"/>
    <circle cx="16" cy="21" r="5" fill="#3B82F6"/>
    <text x="30" y="18" fill="#FFFFFF" font-family="-apple-system, sans-serif" font-size="12" font-weight="600">10:15 - David Miller</text>
    <text x="30" y="32" fill="#8A8F98" font-family="-apple-system, sans-serif" font-size="10">Invisalign Check &amp; Occlusal • 8 Photos</text>
    <rect x="175" y="12" width="38" height="18" rx="4" fill="#3B82F6" fill-opacity="0.2"/>
    <text x="194" y="24" fill="#60A5FA" font-family="-apple-system, sans-serif" font-size="9" font-weight="600" text-anchor="middle">ACTIVE</text>
  </g>

  <!-- Item 3 -->
  <g transform="translate(54, 194)">
    <rect width="222" height="42" rx="8" fill="#121522" stroke="#ffffff" stroke-opacity="0.04"/>
    <circle cx="16" cy="21" r="5" fill="#6B7280"/>
    <text x="30" y="18" fill="#D1D5DB" font-family="-apple-system, sans-serif" font-size="12" font-weight="600">11:30 - Emma Watson</text>
    <text x="30" y="32" fill="#6B7280" font-family="-apple-system, sans-serif" font-size="10">Crown Prep &amp; Shade Match</text>
    <rect x="175" y="12" width="38" height="18" rx="4" fill="#374151" fill-opacity="0.3"/>
    <text x="194" y="24" fill="#9CA3AF" font-family="-apple-system, sans-serif" font-size="9" font-weight="600" text-anchor="middle">QUEUED</text>
  </g>

  <g transform="translate(54, 244)">
    <rect width="222" height="40" rx="8" fill="#0E111D" stroke="#ffffff" stroke-opacity="0.03"/>
    <text x="111" y="24" fill="#6B7280" font-family="-apple-system, sans-serif" font-size="11" font-weight="500" text-anchor="middle">+ 5 Upcoming Patients (Daylist)</text>
  </g>

  <!-- Right Side: Storage & Security Badge -->
  <g transform="translate(306, 78)">
    <rect width="134" height="220" rx="14" fill="#0A0D18" stroke="#ffffff" stroke-opacity="0.08"/>
    
    <!-- BYOS Icon -->
    <rect x="47" y="20" width="40" height="40" rx="10" fill="#6663F6" fill-opacity="0.15" stroke="#6663F6" stroke-opacity="0.4"/>
    <path d="M67 33v14m-7-7h14" stroke="#8C88FF" stroke-width="2" stroke-linecap="round"/>
    <text x="67" y="76" fill="#FFFFFF" font-family="-apple-system, sans-serif" font-size="12" font-weight="700" text-anchor="middle">BYOS</text>
    <text x="67" y="90" fill="#8A8F98" font-family="-apple-system, sans-serif" font-size="9" text-anchor="middle">Your Storage</text>

    <line x1="20" y1="104" x2="114" y2="104" stroke="#ffffff" stroke-opacity="0.08"/>

    <!-- Cloud Providers -->
    <text x="67" y="124" fill="#60A5FA" font-family="-apple-system, sans-serif" font-size="10" font-weight="600" text-anchor="middle">✓ Google Drive</text>
    <text x="67" y="142" fill="#60A5FA" font-family="-apple-system, sans-serif" font-size="10" font-weight="600" text-anchor="middle">✓ OneDrive</text>
    <text x="67" y="160" fill="#60A5FA" font-family="-apple-system, sans-serif" font-size="10" font-weight="600" text-anchor="middle">✓ Dropbox / Local</text>

    <!-- RAM Shield -->
    <rect x="18" y="174" width="98" height="32" rx="6" fill="#10B981" fill-opacity="0.1" stroke="#10B981" stroke-opacity="0.3"/>
    <text x="67" y="188" fill="#10B981" font-family="-apple-system, sans-serif" font-size="9" font-weight="700" text-anchor="middle">0% Raw Image</text>
    <text x="67" y="199" fill="#10B981" font-family="-apple-system, sans-serif" font-size="8" text-anchor="middle">Server Storage</text>
  </g>
</svg>
